description: >-
  Firefly publishes no plans, no rate card and no price of any kind. Every commercial
  route on both fireflyon.com and fireflydooh.com terminates in a contact form or a
  named sales inbox: the advertising-solutions page routes buyers to sales, and the
  2022 programmatic announcement directs technical/programmatic inquiries to
  programmatic@fireflyon.com. Media is sold either as an insertion order through the
  Firefly sales team or programmatically as Programmatic Guaranteed / open-marketplace
  deals negotiated inside third-party DOOH SSPs (Place Exchange, Vistar Media,
  Hivestack, Broadsign), where the price lives in the deal, not on a public page. There
  is no self-serve tier, no free tier, no trial, and no published CPM.
pricing_model: contact-sales
