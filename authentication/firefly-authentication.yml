audiences:
- audience: https://gw.fireflyon.com
  used_by: https://app.fireflyon.com (Firefly advertiser dashboard SPA)
  source: >-
    window.REACT_APP_AUTH0_AUDIENCE in the public SPA runtime config at
    https://app.fireflyon.com/config.js (HTTP 200). The audience hostname
    gw.fireflyon.com does not itself resolve in DNS; the gateway the SPA calls is
    https://app-gw.api.fireflyon.com.
  note: >-
    Access tokens minted for this audience are what the advertiser dashboard presents to
    app-gw.api.fireflyon.com. That gateway answers 404 text/plain "404 page not found"
    to every unauthenticated path probed, so its operation set cannot be read without
    an advertiser account.
gaps:
- id: no-public-auth-documentation
  detail: >-
    Firefly publishes no authentication guide, no key/credential issuance page and no
    developer portal. The only machine-readable auth surface is the Auth0 discovery
    document above, which is platform-generated rather than Firefly-authored prose.
  evidence:
  - url: https://www.fireflyon.com/sitemap.xml
    status: 200
    note: 90 URLs, none developer- or API-facing.
- id: no-protected-resource-metadata
  detail: >-
    No RFC 9728 OAuth protected-resource metadata is served by the gateway, so a client
    cannot discover which authorization server protects app-gw.api.fireflyon.com without
    reading the SPA config.
  evidence:
  - url: https://app-gw.api.fireflyon.com/.well-known/oauth-protected-resource
    status: 404
