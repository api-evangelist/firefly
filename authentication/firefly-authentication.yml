scope_of_this_artifact: >-
  This describes the identity layer in front of the Firefly advertiser dashboard
  (app.fireflyon.com) and its API gateway (app-gw.api.fireflyon.com) — NOT a public
  Firefly developer API. Firefly publishes no developer portal, no API reference and
  no OpenAPI; see x-coverage in apis.yml. The document below was read verbatim from a
  live, unauthenticated GET of the OpenID Connect discovery endpoint on Firefly's own
  auth host, so every value here is Firefly-served fact rather than derivation.
  The endpoint set is an Auth0 custom-domain tenant
  (auth.fireflyon.com CNAME -> fireflyon-cd-p4enovzjyobijetz.edge.tenants.auth0.com),
  which means the surface reflects Auth0 platform defaults; Firefly-specific choices
  cannot be separated from platform defaults without authenticated access.
