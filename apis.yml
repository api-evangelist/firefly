  detail: >-
    Firefly ships no developer site of its own — fireflyon.com/developers, /api, /docs and
    /pricing all 404 and its 90-URL sitemap contains no reference page — and the only live
    Firefly API host, the advertiser-dashboard gateway app-gw.api.fireflyon.com, answers
    404 text/plain to every unauthenticated path including /openapi.json; the integration
    surface a buyer actually programs against is Firefly's inventory listed inside
    third-party DOOH SSPs (Place Exchange, Vistar Media, Hivestack, Broadsign, VIOOH),
    whose OpenRTB contracts belong to those platforms rather than to Firefly.
