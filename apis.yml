name: Firefly
description: Firefly Systems Inc. is a data-first moving out-of-home (mOOH) advertising network
  that turns taxis, rideshare vehicles, and other mobility assets into digital and static advertising
  surfaces across 15+ major North American markets and several countries. Its network of tens of
  thousands of GPS-connected screens delivers geo-targeted, contextual, and programmatic digital
  out-of-home (DOOH) campaigns with advanced tracking, attribution, and measurement. Firefly offers
  digital and static car tops, full and partial car wraps, in-car TaxiTV, around-car activations, and
  experiential LED and hologram truck formats. Programmatic demand reaches Firefly inventory through
  third-party DOOH supply-side platforms rather than a Firefly endpoint — its own advertising-solutions
  page names Place Exchange, Vistar Media, Hivestack and Broadsign, alongside a VIOOH integration, and
  supports Programmatic Guaranteed and open-marketplace deals. The company is backed by investors
  including 500 Global, Andreessen Horowitz (a16z), and GV (Google Ventures).
