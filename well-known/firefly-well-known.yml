method: probed
source: live GET of /.well-known/* and /llms.txt on every Firefly host discovered from
  apis.yml, DNS enumeration, and the advertiser-dashboard SPA runtime config
summary: >-
  Firefly serves exactly one real /.well-known/ surface, and it is not on the marketing
  site: the Auth0 custom-domain tenant at https://auth.fireflyon.com publishes a full
  OpenID Connect discovery document and a byte-identical RFC 8414 OAuth authorization-server
  metadata document. Both are saved here verbatim. Everything else misses — no security.txt
  on any host, no api-catalog, no ai-plugin.json, no A2A agent card, no llms.txt, and no
  OAuth protected-resource metadata. The marketing site (Squarespace) and the API gateway
  return honest 404s. The advertiser-dashboard SPA at app.fireflyon.com answers HTTP 200
  with its React shell for EVERY path including a nonsense control path, so none of its
  200s are documents; they are recorded below as soft-404 false positives, not as hits.
hosts:
- host: https://auth.fireflyon.com
  role: >-
    Auth0 custom-domain tenant (CNAME -> fireflyon-cd-p4enovzjyobijetz.edge.tenants.auth0.com).
    The identity provider behind the Firefly advertiser dashboard.
  control_path: /.well-known/zzz-nonexistent-abc
  control_status: 404
  control_note: >-
    Control returns 404 text/plain "Not found." — this host does NOT answer /.well-known/*
    with a catch-all, so the 200s below are real documents.
  documents:
  - path: /.well-known/openid-configuration
    status: 200
    content_type: application/json; charset=utf-8
    bytes: 2501
    file: firefly-openid-configuration.json
    description: >-
      OpenID Connect discovery for the Firefly advertiser dashboard. issuer
      https://auth.fireflyon.com/, authorization/token/userinfo/revocation/device-code
      endpoints, dynamic client registration endpoint, 14 scopes_supported, PKCE S256.
  - path: /.well-known/oauth-authorization-server
    status: 200
    content_type: application/json; charset=utf-8
    bytes: 2501
    file: firefly-oauth-authorization-server.json
    description: >-
      RFC 8414 authorization server metadata — verified byte-identical (SHA-256 match)
      to the OIDC discovery document above.
  - path: /.well-known/jwks.json
    status: 200
    content_type: application/json; charset=utf-8
    bytes: 3088
    description: >-
      Live JWKS — RSA signing keys for the tenant. Not saved: key material rotates, and
      the jwks_uri in the discovery document is the canonical, always-current reference.
