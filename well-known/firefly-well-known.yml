findings:
- id: only-identity-surface-is-machine-readable
  severity: informational
  detail: >-
    The only machine-readable document Firefly publishes anywhere is its Auth0 discovery
    metadata, and that is served by the Auth0 platform on Firefly's custom domain rather
    than authored by Firefly. There is no OpenAPI, no llms.txt, no security.txt and no
    agent card on any Firefly host.
  evidence:
  - url: https://auth.fireflyon.com/.well-known/openid-configuration
    status: 200
  - url: https://app-gw.api.fireflyon.com/openapi.json
    status: 404
- id: no-security-txt
  severity: low
  detail: >-
    No security.txt on any host, and no vulnerability-disclosure or bug-bounty program
    was found (probe-security-programs.py returned vdp=none trust=none). A security
    researcher has no published channel; the only contact affordance is the general
    https://www.fireflyon.com/contact form.
  evidence:
  - url: https://www.fireflyon.com/.well-known/security.txt
    status: 404
  - url: https://auth.fireflyon.com/.well-known/security.txt
    status: 404
  - url: https://app-gw.api.fireflyon.com/.well-known/security.txt
    status: 404
  - url: https://www.fireflydooh.com/.well-known/security.txt
    status: 404
- id: round-2-widened-the-host-set-and-still-found-no-contract
  severity: informational
  added: '2026-08-12'
  detail: >-
    The second round added four hosts the first round never saw — www.fireflydooh.com
    (Firefly's second marketing domain), adops.fireflyon.com (the internal "Firefly
    Geometrics" ad-ops SPA), adm.fireflyon.com (a 301 redirector to app.fireflyon.com)
    and support.fireflyon.com (a Zendesk help center) — plus two further API hostnames
    named in the adops SPA config, geometrics.api.fireflyon.com and
    media-api.fireflyon.com. Both of those are NXDOMAIN from the public internet. No new
    machine-readable document was found on any of them. The conclusion of round 1 stands
    against a host set that is now twice as large.
  evidence:
  - url: https://adops.fireflyon.com/openapi.json
    status: 404
  - url: https://www.fireflydooh.com/openapi.json
    status: 404
  - url: https://adm.fireflyon.com/openapi.json
    status: 301
    note: 301 to https://app.fireflyon.com/openapi.json — a pure redirector, no documents of its own.
- id: zendesk-help-center-is-driver-facing
  severity: informational
  added: '2026-08-12'
  detail: >-
    Firefly runs a Zendesk help center at support.fireflyon.com. Our direct probe is
    answered by a Cloudflare interstitial (403), but the anonymous Zendesk Help Center API
