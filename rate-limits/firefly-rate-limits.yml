description: >-
  Firefly documents no rate limits, because Firefly documents no API. There is no
  developer portal, no API reference and no OpenAPI on any Firefly host. The only live
  Firefly API surface found is the advertiser-dashboard gateway
  https://app-gw.api.fireflyon.com, which answers every unauthenticated request with
  HTTP 404 text/plain "404 page not found" (Go net/http default) and emits no
  RateLimit-*, X-RateLimit-* or Retry-After header on that response, so no runtime
  throttling signal can be observed anonymously either.
observed_headers_on_unauthenticated_response: []
note: >-
  limit_count is a measured zero, not an unchecked field. No `RateLimits` pointer is
  emitted in apis.yml: that pointer asserts the provider publishes a rate-limit signal,
  and Firefly publishes none. Recording the honest zero here keeps the finding
  re-checkable without crediting an absence as a presence.
